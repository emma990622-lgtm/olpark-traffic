<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALL PARK</title>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="assets/style.css?v=8">
<link rel="stylesheet" href="https://spoqa.github.io/spoqa-han-sans/css/SpoqaHanSansNeo.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&display=swap">
<link rel="stylesheet" href="assets/park-web.css?v=4">
</head>
<body class="park-web">
<a class="skip-link" href="#journeyTitle">본문으로 바로가기</a>
<header class="park-header"><div class="park-header-inner">
  <a class="park-brand" href="index.html"><img src="assets/olympic-park-symbol.svg?v=2" width="48" height="48" alt=""><span>ALL PARK</span></a>
</div></header>
<div class="journey-layout">
<main id="journeyMain">
  <div class="journey-toolbar"><button id="journeyBack" class="text-button" type="button" hidden>이전으로</button></div>
  <div class="journey-heading"><h1 id="journeyTitle" tabindex="-1">공연 선택</h1></div>
  <div class="journey-selection" id="journeySelection" hidden><div><strong id="journeyEvent"></strong><div id="journeyMeta"></div></div><button class="text-button" id="journeyChange" type="button">변경</button></div>
  <section class="card" data-journey="event">
    <h2 class="visually-hidden">공연 선택</h2>
    <div class="row">
      <div><label class="field" for="date">날짜</label><select id="date"></select></div>
      <div hidden><label class="field" for="event">공연</label><select id="event"></select></div>
    </div>
    <div class="show-list" id="journeyShows" aria-label="공연 목록"><p role="status">공연 일정 불러오는 중</p></div>
    <div id="eventInfo" hidden></div>
  </section>

  <section class="card" data-journey="mode" hidden>
    <h2 class="visually-hidden">이동 방법 선택</h2>
    <div class="toggle" id="mode" role="group" aria-label="이동 수단 선택">
      <button type="button" data-v="car" class="on"><strong>자동차</strong></button>
      <button type="button" data-v="transit"><strong>대중교통</strong></button>
    </div>
  </section>

  <section class="card" data-journey="topics" aria-labelledby="journeyTitle" hidden>
    <div class="topic-choices">
      <button type="button" data-topic="parking">출구별 귀가 안내</button>
      <button type="button" data-topic="map">주변 도로와 도보 경로</button>
      <button type="button" data-topic="arrival">시간대별 공연장 도착 관객수</button>
    </div>
  </section>

  <section class="card" id="transitSection" data-journey="transit" hidden>
    <h2>가까운 지하철역</h2>
    <div class="gps-bar">
      <button type="button" class="ghost" id="stGpsBtn">현재 위치(GPS)에서 역까지 거리 보기</button>
      <button type="button" class="ghost gps-off" data-gps-off="1" hidden>위치 끄기</button>
      <span class="muted small" id="stGpsNote" role="status"></span>
    </div>
    <div class="table-scroll">
      <table class="list" id="stations"></table>
    </div>
    <div class="notice info" id="stationTip" style="margin-top:12px"></div>
    <span id="walkSrc" hidden></span>
    <div class="topic-choices">
      <button type="button" data-topic="map">주변 도로와 도보 경로</button>
      <button type="button" data-topic="arrival">시간대별 공연장 도착 관객수</button>
    </div>
  </section>

  <section class="card" id="exitGate" data-journey="car" hidden>
    <div data-car="parking">
    <div class="gps-bar">
      <button type="button" class="ghost" id="egGpsBtn">현재 위치(GPS)로 주차한 곳 찾기</button>
      <button type="button" class="ghost gps-off" data-gps-off="1" hidden>위치 끄기</button>
      <span class="muted small" id="egGpsNote" role="status"></span>
    </div>
    <div class="eg-zones" id="egZone" role="group" aria-label="주차한 곳"></div>
    <p id="parkingStatus" role="status">주차 구역 불러오는 중</p>
    </div>
    <div data-car="direction" hidden>
      <div class="eg-zones" id="egWay" role="group" aria-label="이동 방면"></div>
      <button class="text-button" id="skipDirection" type="button" hidden>방면 선택 건너뛰기</button>
    </div>
    <div data-car="guide" hidden>
    <div id="egResult" role="status" style="margin-top:12px"></div>
    <details class="weather-detail"><summary>날씨에 따른 출차 시간 확인</summary>
    <div style="margin-bottom:8px;max-width:22em"><label class="field" for="egWx">날씨</label>
      <select id="egWx"><option value="auto">공연 날 예보 사용(24시간 앞까지)</option><option value="dry">보통 날씨</option><option value="rain">비</option><option value="cold">추위 (체감 0도 미만)</option></select></div>
    <div id="egWeather" role="status">불러오는 중…</div>
    </details><p id="egSrc" hidden></p>
    </div>
  </section>

  <section class="card park-map" data-journey="map" aria-labelledby="journeyTitle" hidden>
    <div class="gps-bar">
      <button type="button" class="ghost" id="mapGpsBtn">내 현재 위치(GPS) 지도에 표시</button>
      <button type="button" class="ghost gps-off" data-gps-off="1" hidden>위치 끄기</button>
      <span class="muted small" id="mapGpsNote" role="status"></span>
    </div>
    <div id="map3d" class="map3d"></div>
    <div id="legend3d"></div>
    <details id="flat"><summary class="muted small">평면 지도</summary>
      <div class="map-wrap"><svg class="map" id="map"></svg></div>
      <div id="legend"></div>
    </details>
    <p class="live-foot" id="roadNote">불러오는 중…</p>
  </section>
  <section class="card" id="visitorCard" data-journey="arrival" aria-labelledby="journeyTitle" hidden>
    <div id="vfStatus" class="le-status" role="status">불러오는 중…</div>
    <div id="vfChart" class="arr-chart-wrap"></div>
    <div id="vfNote" hidden></div>
    <p id="vfSrc" hidden></p>
  </section>
  <div class="result-reset" data-journey="result" hidden><button class="text-button" id="journeyRestart" type="button">다른 공연 선택</button></div>
</main></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="assets/common.js?v=ped2"></script>
<script src="assets/map3d.js?v=ped2"></script>
<script src="assets/audience.js?v=all-park"></script>
<script src="assets/visitor.js?v=all-park-2"></script>
<script src="assets/exit_gate.js?v=all-park"></script>
<script src="assets/park-journey.js?v=5"></script>
</body>
</html>
