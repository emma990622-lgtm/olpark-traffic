<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>올팍 공연 혼잡 대응 · 운영자·기관</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <h1>올팍 공연 혼잡 대응</h1>
  <nav><a href="index.html">관객</a><a class="on" href="operator.html">운영자·기관</a></nav>
</header>

<main class="wide">
  <section class="card no-print">
    <div class="row">
      <div style="flex:0 1 260px"><label class="field" for="date">날짜</label><select id="date"></select></div>
      <div style="flex:0 1 160px"><label class="field" for="showMin">공연 길이(분)</label>
        <select id="showMin"></select></div>
      <div class="muted small" style="align-self:end">예측 모델이 연결되기 전에는 공연 규모 규칙과 2024년 7월 실제 기록을 참고값으로 보여 줘요.</div>
    </div>
  </section>

  <section class="card">
    <h2>그날의 공연</h2>
    <table class="list" id="events"></table>
    <div class="kpis" id="kpis" style="margin-top:14px"></div>
  </section>

  <div class="grid2">
    <section class="card">
      <h2>공연 후 출차 곡선 (참고: 2024년 7월 실제)</h2>
      <svg id="chart" style="width:100%;height:auto"></svg>
      <p class="muted small" id="chartNote"></p>
    </section>
    <section class="card">
      <h2>주변 도로 (3D, 최근 수집값)</h2>
      <div id="map3d" class="map3d"></div>
      <div id="legend3d"></div>
      <details id="flat"><summary class="muted small">평면 지도로 보기</summary>
        <svg class="map" id="map"></svg>
        <div id="legend"></div>
      </details>
      <p class="muted small" id="roadNote">불러오는 중…</p>
    </section>
  </div>

  <section class="card">
    <h2>공연 전후 도로 상황 (5분 단위 실측)</h2>
    <div id="roadCheck" class="muted small" style="margin-bottom:8px"></div>
    <div class="muted small" id="roadDayNote">불러오는 중…</div>
    <svg id="roadChart" style="width:100%;height:auto;margin-top:8px"></svg>
    <div class="legend" id="roadChartLegend"></div>
    <h3 style="font-size:14px;margin:18px 0 6px">도로별 속도 변화</h3>
    <div id="heat" style="overflow-x:auto"></div>
    <h3 style="font-size:14px;margin:18px 0 6px">가장 많이 느려진 구간</h3>
    <table class="list" id="slowTop"></table>
  </section>

  <section class="card">
    <h2>출구별 대응</h2>
    <div id="gateNote" class="muted small" style="margin-bottom:8px"></div>
    <table class="list" id="gateTable"></table>
    <p class="muted small" id="gateSrc"></p>
  </section>

  <section class="card print-me">
    <div class="no-print" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2 style="margin:0">기관 공유용 한 장 요약</h2>
      <button class="primary" onclick="window.print()">인쇄 / PDF로 저장</button>
    </div>
    <div class="brief" id="brief"></div>
  </section>
</main>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="assets/common.js"></script>
<script src="assets/map3d.js"></script>
<script src="assets/operator.js"></script>
</body>
</html>
