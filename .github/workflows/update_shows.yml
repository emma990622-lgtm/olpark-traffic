# 공연 정보 자동 수집: 올림픽공원 공식 일정 + 예매처(NOL·YES24·멜론) 관람시간·회차 → web/data/events.json
# 하루 두 번(한국 시각 05:23, 13:23) 돌고, 바뀐 것이 있을 때만 main에 올린다(→ 1~2분 뒤 사이트 반영).
# 인증키 필요 없음. Actions 탭에서 "Run workflow"로 바로 돌릴 수도 있다.
name: update-shows

on:
  schedule:
    - cron: "23 20,4 * * *"   # GitHub 서버는 UTC 기준 → 한국 05:23, 13:23
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-shows
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 준비
        run: pip install pandas
      - name: 공연 정보 받기
        run: python scripts/28_update_shows.py
      - name: 점검
        run: python scripts/check_all.py
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/olpark_events_live.json data/processed/show_seller.csv data/processed/event_days.csv web/data/events.json
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "공연 정보 자동 갱신 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
          git pull --rebase
          git push
